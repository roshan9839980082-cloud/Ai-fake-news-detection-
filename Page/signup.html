<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - NewsGuardAI</title>
    <!-- Fixed Path -->
    <link rel="stylesheet" href="/css/signup.css" />
  </head>
  <body>
    <!-- <div id="navbar-placeholder"></div> -->
    <div class="signup-wrapper">
      <!-- Top Header & Logo -->
      <div class="header-section">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.09-5.09 1.41 1.41L11 16.5z"
              />
            </svg>
          </div>
          <span class="logo-text"
            >NewsGuard<span class="logo-highlight">AI</span></span
          >
        </a>

        <h1>Create Account</h1>
        <p>Start verifying news in seconds</p>
      </div>

      <!-- Main Card Container -->
      <div class="signup-card">
        <!-- Google Button -->
        <button type="button" class="google-btn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
            />
          </svg>
          Sign up with Google
        </button>

        <!-- Divider -->
        <div class="divider">
          <span>or</span>
        </div>

        <!-- Form (FIXED: Added action & method) -->
        <!-- PEHLE THA: <form action="/signup" method="POST" id="signupForm"> -->

        <form action="http://127.0.0.1:5000/signup" method="POST" id="signupForm">
          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <!-- FIXED: Added name="username" -->
              <input
                type="text"
                id="fullName"
                name="username"
                placeholder="John Doe"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                ></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <!-- FIXED: Added name="email" -->
              <input
                type="email"
                id="email"
                name="email"
                placeholder="xyz@gmail.com"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <!-- FIXED: Added name="password" -->
              <input
                type="password"
                id="password"
                name="password"
                placeholder="•••••••••"
                required
              />
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn">
            Create Account <span>&rarr;</span>
          </button>
        </form>

        <!-- Footer Link -->
        <div class="card-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
    <!-- FIXED: Paths updated -->
    <!-- <script src="/js/navbar.js"></script> -->
    <script src="/js/signup.js"></script>
  </body>
</html>
